[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "mcd"
version = "0.1.0"
description = "Mahalanobis Concept Drift Detector for multilingual customer support tickets"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Valery Shabashev" }]
requires-python = ">=3.11"

dependencies = [
  "numpy>=1.24",
  "pandas>=1.5",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "sentence-transformers>=2.2",
  "streamlit>=1.30",
  "matplotlib>=3.7",
  "scipy>=1.11",
]

[project.optional-dependencies]
train = ["torch>=2.1"]
dev = [
  "torch>=2.1",
  "pytest>=7.0",
  "mypy>=1.8",
]

[project.urls]
Repository = "https://github.com/sha-bash/mahalanobis-concept-drift"
Documentation = "docs/"

[project.scripts]
mcd = "mcd.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = "."
# Scoped until the rest of `src/mcd` is brought up to strict typing.
files = [
  "src/mcd/projection/projector.py",
  "src/mcd/modeling/classifier.py",
  "scripts/train_projector.py",
]
follow_imports = "silent"

[tool.pytest.ini_options]
pythonpath = ["."]

[[tool.mypy.overrides]]
module = [
  "joblib.*",
  "matplotlib.*",
  "pandas.*",
  "sentence_transformers.*",
  "sklearn.*",
  "streamlit.*",
  "torch.*",
]
ignore_missing_imports = true
